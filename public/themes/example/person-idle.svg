<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80"><style>.skin{fill:#F2C9A0}.shirt{fill:#3B6FD8}.hair{fill:#3A2A20}.ink{fill:#1E2235}.line{fill:none;stroke:#1E2235;stroke-width:1.3;stroke-linecap:round}
.arm{fill:none;stroke:#3B6FD8;stroke-width:6;stroke-linecap:round}
.tl{animation:tap .5s ease-in-out infinite alternate;transform-origin:17px 42px}.tr{animation:tap .5s ease-in-out infinite alternate-reverse;transform-origin:43px 42px}
@keyframes tap{to{transform:rotate(-6deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-origin:43px 42px}@keyframes wave{to{transform:rotate(14deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1px)}}
.dots circle{animation:dot 1.2s infinite;opacity:.2}.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}@keyframes dot{40%{opacity:1}}
.pop{animation:pop 1.4s ease-in-out infinite}@keyframes pop{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><path d="M14 80 V50 q0 -12 16 -12 q16 0 16 12 V80 Z" class="shirt"/><path d="M17 42 q-6 10 -2 20" class="arm"/><path d="M43 42 q2 10 -8 13" class="arm"/><rect x="31" y="49" width="7" height="8" rx="1.5" fill="#F4F1E8" stroke="#8A6A4E" stroke-width="1"/><path d="M38 51 q3 1 0 4" fill="none" stroke="#8A6A4E" stroke-width="1"/><rect x="26" y="31" width="8" height="8" class="skin"/><circle cx="30" cy="22" r="11" class="skin"/><path d="M19 21 q0 -12 11 -12 q11 0 11 12 q-4 -6 -11 -6 q-7 0 -11 6z" class="hair"/><path d="M24.5 23 q1.5 1.2 3 0" class="line"/><path d="M32.5 23 q1.5 1.2 3 0" class="line"/><path d="M27 28 q3 2 6 0" class="line"/></g></svg>
