<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 60 96"><title>Krishna: planning</title><style>
.ink{fill:#1E2235}.line{fill:none;stroke:#1E2235;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-.8px)}}
.tl{animation:tap .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
.tr{animation:tap .45s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:top}
@keyframes tap{to{transform:rotate(-7deg)}}
.wave{animation:wave .9s ease-in-out infinite alternate;transform-origin:44px 44px}@keyframes wave{to{transform:rotate(16deg)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
.trunk{animation:trunk 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}@keyframes trunk{to{transform:rotate(-8deg)}}
.notes text{animation:note 3s ease-out infinite;opacity:0}.notes text:nth-child(2){animation-delay:1s}.notes text:nth-child(3){animation-delay:2s}
@keyframes note{15%{opacity:1}100%{opacity:0;transform:translate(8px,-22px)}}
.pull{animation:pull 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:right}@keyframes pull{50%{transform:translateX(-3px)}}
.spark{animation:spark 1s steps(2) infinite}@keyframes spark{50%{opacity:.25}}
.glow{animation:glow 2s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.flicker{animation:flick 2.2s steps(3) infinite}@keyframes flick{40%{opacity:.75}60%{opacity:.95}}
.pop{animation:pop 1.4s ease-in-out infinite}@keyframes pop{50%{transform:translateY(-2px)}}
.dots circle{animation:dot 1.2s infinite;opacity:.2}.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}@keyframes dot{40%{opacity:1}}
.scribble{stroke-dasharray:18;stroke-dashoffset:18;animation:scr 2.4s linear infinite}@keyframes scr{60%,100%{stroke-dashoffset:0}}
.zz text{animation:zz 2.6s ease-out infinite;opacity:0}.zz text:nth-child(2){animation-delay:1.3s}@keyframes zz{20%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.notes text,.zz text{opacity:0}.scribble{stroke-dashoffset:0}}</style><g class="bob"><path d="M11 80 V51 q0 -13 19 -13 q19 0 19 13 V80 Z" fill="#F2B825"/><path d="M13 46 Q32 58 49 72 V80 H40 Q26 62 11 55 Z" fill="#E07B2A"/><path d="M22 40 q8 10 16 0" fill="none" stroke="#E84A5F" stroke-width="2.2"/><path d="M17 20 q0 -14 13 -14 q13 0 13 14 v20 q-4 4 -6 0 v-14 h-14 v14 q-2 4 -6 0z" fill="#14182A"/><rect x="26" y="30" width="8" height="9" fill="#496fc8"/><circle cx="30" cy="22" r="11" fill="#4F79D9"/><path d="M19 20 q0 -11 11 -11 q11 0 11 11 q-4 -6 -11 -6 q-7 0 -11 6z" fill="#14182A"/><path d="M24.5 22 q1.5 1.2 3 0" class="line"/><path d="M32.5 22 q1.5 1.2 3 0" class="line"/><path d="M26.5 27 q3.5 3 7 0" class="line"/><ellipse cx="22.5" cy="26" rx="2.2" ry="1.3" fill="#E86A8F" opacity=".25"/><ellipse cx="37.5" cy="26" rx="2.2" ry="1.3" fill="#E86A8F" opacity=".25"/><path d="M28 12 L30 18 L32 12" fill="none" stroke="#FFF3B0" stroke-width="1.2"/><circle cx="30" cy="16" r=".9" fill="#D8343A"/><path d="M17 15 L19 2 L24 8 L30 -1 L36 8 L41 2 L43 15 Z" fill="#E8B830"/><rect x="16" y="12" width="28" height="5" rx="1.5" fill="#ba9326"/><circle cx="30" cy="6" r="2.2" fill="#C8352E"/><circle cx="22" cy="10" r="1.2" fill="#2E9E6A"/><circle cx="38" cy="10" r="1.2" fill="#2E9E6A"/><g class="sway"><path d="M36 6 Q38 -6 42 -14" stroke="#2E6B3A" stroke-width="1.2" fill="none"/><ellipse cx="42" cy="-16" rx="5" ry="9" fill="#1E8E5A" transform="rotate(20 42 -16)"/><ellipse cx="42" cy="-16" rx="3.4" ry="6" fill="#1DA1A0" transform="rotate(20 42 -16)"/><ellipse cx="42.5" cy="-17" rx="2.2" ry="3" fill="#1C3F9E" transform="rotate(20 42 -16)"/><circle cx="42.6" cy="-17.5" r="1" fill="#E9B23A"/></g><g class=""><path d="M16 44 q-3 -6 10 -14" fill="none" stroke="#F2B825" stroke-width="6.5" stroke-linecap="round"/></g><g class=""><path d="M44 44 q8 -4 0 -16" fill="none" stroke="#F2B825" stroke-width="6.5" stroke-linecap="round"/></g><circle cx="27" cy="30" r="3.4" fill="#4F79D9"/><circle cx="43" cy="28" r="3.4" fill="#4F79D9"/><line x1="20" y1="31" x2="56" y2="27" stroke="#9A5B2A" stroke-width="3" stroke-linecap="round"/><g fill="#3E2412"><circle cx="46" cy="28" r=".8"/><circle cx="50" cy="27.6" r=".8"/></g><g class="notes" fill="#3B5FAF" font-size="7" font-family="serif"><text x="52" y="22">♪</text><text x="55" y="25">♫</text><text x="50" y="24">♪</text></g></g></svg>
